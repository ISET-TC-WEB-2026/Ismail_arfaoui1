<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantStore - Formulaire de Commande</title>
    <link rel="icon" href="img/TREES.jpg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>PlantStore</h1>
        <nav>
            <ul>
                <li><a href="index.html" target="_blank">Accueil</a></li>
                <li><a href="produits.html" target="_blank">Catalogue</a></li>
                <li><a href="panier.html" target="_blank">Panier</a></li>
                <li><a href="commande.html" class="active" target="_blank">Commande</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Validation de votre Commande</h2>
            
            <form id="order-form" action="#" method="POST">
                <!-- Personal Info -->
                <div class="form-group">
                    <label for="lastname">Nom :</label>
                    <input type="text" id="lastname" name="lastname" required>
                </div>

                <div class="form-group">
                    <label for="firstname">Prénom :</label>
                    <input type="text" id="firstname" name="firstname" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone :</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ex: 48035579" required>
                </div>

                <!-- Delivery Info -->
                <div class="form-group">
                    <label for="address">Adresse de livraison :</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="shipping">Mode de livraison :</label>
                    <select id="shipping" name="shipping" required>
                        <option value="">-- Choisir une option --</option>
                        <option value="standard">Livraison à domicile (Standard)</option>
                        <option value="express">Livraison Express</option>
                    </select>
                </div>

                <!-- Fictional Payment Info -->
                <div class="form-group">
                    <label for="payment">Mode de paiement (Fictif) :</label>
                    <select id="payment" name="payment" required>
                        <option value="">-- Choisir une option --</option>
                        <option value="cod">Paiement à la livraison</option>
                        <option value="card">Carte bancaire fictive</option>
                    </select>
                </div>

                <!-- Validation Button -->
                <button type="submit" id="btn-submit-order">Confirmer la commande</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PlantStore. Tous droits réservés.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
